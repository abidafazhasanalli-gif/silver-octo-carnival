<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الباحث الحديثي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1e4;--card:#fffdf7;--ink:#1d2b24;--muted:#6b756e;--green:#0f5c43;--green2:#16805d;--gold:#b8892b;--line:#e5dcc3;--shadow:0 10px 30px rgba(15,92,67,.12)}
@media (prefers-color-scheme:dark){:root{--bg:#0d1612;--card:#14221b;--ink:#eee8d6;--muted:#9aa89f;--green:#2fb386;--green2:#1f8f6a;--gold:#e0b04e;--line:#264234;--shadow:0 10px 30px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Cairo',Tahoma,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
background-image:radial-gradient(circle at 20% 0%,rgba(184,137,43,.12),transparent 40%),radial-gradient(circle at 90% 10%,rgba(22,128,93,.15),transparent 45%)}
header{text-align:center;padding:56px 20px 30px;position:relative}
.orn{color:var(--gold);letter-spacing:10px;font-size:18px}
h1{font-family:'Amiri',serif;font-size:clamp(40px,8vw,72px);margin:6px 0;color:var(--green);line-height:1.2;text-shadow:0 2px 0 rgba(184,137,43,.25)}
.sub{color:var(--muted);font-size:17px;max-width:560px;margin:0 auto}
.search{max-width:760px;margin:26px auto 0;padding:0 16px}
.box{display:flex;gap:8px;background:var(--card);border:2px solid var(--gold);border-radius:60px;padding:8px;box-shadow:var(--shadow)}
.box input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:18px;color:var(--ink);padding:10px 18px;outline:none}
.box button{border:0;cursor:pointer;font:inherit;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--green),var(--green2));border-radius:50px;padding:10px 28px;font-size:17px;transition:.2s}
.box button:hover{transform:scale(1.04)}
.box button:disabled{opacity:.6;cursor:wait}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.chip{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:30px;padding:5px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip:hover{border-color:var(--gold);color:var(--gold)}
main{max-width:860px;margin:30px auto;padding:0 16px 40px}
.status{text-align:center;color:var(--muted);padding:30px 10px}
.spin{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--gold);border-radius:50%;margin:0 auto 12px;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.res{background:var(--card);border:1px solid var(--line);border-right:5px solid var(--gold);border-radius:14px;padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow);animation:in .4s both}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.res h3{margin:0 0 6px;font-family:'Amiri',serif;font-size:22px;color:var(--green)}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.tag{font-size:13px;background:rgba(184,137,43,.14);color:var(--gold);border-radius:20px;padding:2px 12px}
.txt{font-family:'Amiri',serif;font-size:20px;line-height:2;white-space:pre-wrap}
.txt mark{background:rgba(184,137,43,.3);color:inherit;border-radius:4px;padding:0 2px}
.res a{display:inline-block;margin-top:10px;color:var(--green2);font-weight:600;text-decoration:none;font-size:15px}
.res a:hover{text-decoration:underline}
.err{background:rgba(180,50,50,.1);border:1px solid rgba(180,50,50,.4);border-radius:14px;padding:16px;line-height:1.9}
pre.raw{direction:ltr;text-align:left;overflow-x:auto;font-size:13px;white-space:pre-wrap}
footer{text-align:center;padding:26px 16px 40px;color:var(--muted);border-top:1px solid var(--line);max-width:860px;margin:0 auto}
footer b{color:var(--gold)}
</style>
</head>
<body>
<header>
  <div class="orn">❖ ❖ ❖</div>
  <h1>الباحث الحديثي</h1>
  <p class="sub">ابحث في كتب الحديث والعلوم الإسلامية، واقرأ النص مع مصدره ورقم صفحته</p>
  <div class="search">
    <div class="box">
      <input id="q" type="search" placeholder="اكتب موضوعًا أو نص حديث…" maxlength="500" autocomplete="off">
      <button id="go">بحث</button>
    </div>
    <div class="chips">
      <button class="chip">إنما الأعمال بالنيات</button>
      <button class="chip">أحاديث الصبر</button>
      <button class="chip">فضل العلم</button>
      <button class="chip">الرفق</button>
    </div>
  </div>
</header>

<main id="out"></main>

<footer>برمجة: <b>عابد حسن</b><br><small>المصدر: مكتبة الجامع — aljam3.com</small></footer>

<script>
const ENDPOINT = "https://aljam3.com/mcp";
const $ = s => document.querySelector(s);
const out = $("#out"), q = $("#q"), go = $("#go");
let sid = null, rid = 1, ready = false;

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function rpc(method, params, notify) {
  const body = { jsonrpc: "2.0", method, params };
  if (!notify) body.id = rid++;
  const headers = { "Content-Type": "application/json", "Accept": "application/json, text/event-stream" };
  if (sid) headers["Mcp-Session-Id"] = sid;
  const r = await fetch(ENDPOINT, { method: "POST", headers, body: JSON.stringify(body) });
  const s = r.headers.get("Mcp-Session-Id"); if (s) sid = s;
  if (notify) return null;
  if (!r.ok) throw new Error("HTTP " + r.status);
  const t = await r.text();
  let msg;
  if ((r.headers.get("Content-Type") || "").includes("event-stream")) {
    const datas = t.split(/\n/).filter(l => l.startsWith("data:")).map(l => l.slice(5).trim());
    for (const d of datas) { try { const j = JSON.parse(d); if (j.id === body.id) msg = j; } catch {} }
  } else msg = JSON.parse(t);
  if (!msg) throw new Error("empty response");
  if (msg.error) throw new Error(msg.error.message || "MCP error");
  return msg.result;
}

async function init() {
  if (ready) return;
  await rpc("initialize", { protocolVersion: "2025-03-26", capabilities: {}, clientInfo: { name: "alhadithi-researcher", version: "1.0" } });
  try { await rpc("notifications/initialized", {}, true); } catch {}
  ready = true;
}

function findList(o, d = 0) {
  if (!o || d > 4) return null;
  if (Array.isArray(o)) return o.length && typeof o[0] === "object" ? o : null;
  if (typeof o === "object") {
    for (const k of ["results", "items", "hits", "data"]) if (o[k]) { const f = findList(o[k], d + 1); if (f) return f; }
    for (const k in o) { const f = findList(o[k], d + 1); if (f) return f; }
  }
  return null;
}
const pick = (o, keys) => { for (const k of keys) { const v = k.split(".").reduce((a, p) => a && a[p], o); if (v != null && v !== "" && typeof v !== "object") return v; } return null; };

function card(it, term, i) {
  const title = pick(it, ["book_title", "book.title", "book.name", "title", "book_name", "name"]);
  const author = pick(it, ["author_name", "author.name", "author", "book.author.name"]);
  const page = pick(it, ["page_number", "page", "page_no", "printed_page"]);
  const text = pick(it, ["snippet", "excerpt", "text", "content", "highlight"]) || "";
  const url = pick(it, ["url", "source_url", "link", "page_url"]);
  let t = esc(text);
  term.split(/\s+/).filter(w => w.length > 2).forEach(w => { try { t = t.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "g"), m => `<mark>${m}</mark>`); } catch {} });
  return `<article class="res" style="animation-delay:${i * 50}ms">
    <h3>${esc(title || "نتيجة")}</h3>
    <div class="meta">${author ? `<span class="tag">✍ ${esc(author)}</span>` : ""}${page ? `<span class="tag">📖 صفحة ${esc(page)}</span>` : ""}</div>
    <div class="txt">${t}</div>
    ${url ? `<a href="${esc(url)}" target="_blank" rel="noopener">فتح المصدر في الجامع ↖</a>` : ""}
  </article>`;
}

async function search(term) {
  term = term.trim(); if (!term) return;
  go.disabled = true;
  out.innerHTML = `<div class="status"><div class="spin"></div>جارٍ البحث في الكتب…</div>`;
  try {
    await init();
    const res = await rpc("tools/call", { name: "search", arguments: { query: term } });
    let data = res.structuredContent;
    if (!data) {
      const txt = (res.content || []).map(c => c.text || "").join("\n");
      try { data = JSON.parse(txt); } catch { data = txt; }
    }
    const list = typeof data === "object" ? findList(data) : null;
    if (list) out.innerHTML = list.map((it, i) => card(it, term, i)).join("");
    else out.innerHTML = `<div class="res"><div class="txt">${esc(typeof data === "string" ? data : JSON.stringify(data, null, 2))}</div></div>`;
    if (!out.innerHTML.trim()) out.innerHTML = `<div class="status">لا توجد نتائج.</div>`;
  } catch (e) {
    ready = false; sid = null;
    out.innerHTML = `<div class="err"><b>تعذّر الاتصال بالخادم.</b><br>
      تأكد من الاتصال بالإنترنت، وافتح هذا الملف من موقعك أو من متصفح عادي (وليس من داخل معاينة محدودة)، وقد يمنع الخادم الطلبات المباشرة من المتصفح (CORS) فتحتاج وسيطًا بسيطًا في الخادم.<pre class="raw">${esc(e.message)}</pre></div>`;
  } finally { go.disabled = false; }
}

go.onclick = () => search(q.value);
q.addEventListener("keydown", e => { if (e.key === "Enter") search(q.value); });
document.querySelectorAll(".chip").forEach(c => c.onclick = () => { q.value = c.textContent; search(c.textContent); });
</script>
</body>
</html>
